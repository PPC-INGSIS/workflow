name: Gradle check

on:
  # Solo corre cuando otro workflow lo llama, nunca solo
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para bajar de GitHub Packages las convenciones de build y las librerías del proyecto
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        # --continue: muestra todas las fallas juntas, no solo la primera
        run: ./gradlew check --continue
        env:
          # Credenciales para GitHub Packages. El token lo crea GitHub para cada corrida:
          # no hay que configurar ningún secreto.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}