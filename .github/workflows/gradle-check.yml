name: Gradle check

on:
  # Solo corre cuando otro workflow lo llama, nunca solo
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"
    secrets:
      # Solo lo necesita el servicio que baja las librerías de PrintScript
      packages-token:
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check
        run: ./gradlew check
        env:
          # Los mismos nombres que lee el build.gradle del TP1 para GitHub Packages
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.packages-token }}