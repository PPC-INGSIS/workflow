name: Gradle check

on:
  # Solo corre cuando otro workflow lo llama, nunca solo
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "21"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check
        # --continue: muestra todas las fallas juntas, no solo la primera
        run: ./gradlew check --continue