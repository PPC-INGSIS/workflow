name: Docker publish

on:
  workflow_call:
    outputs:
      image:
        description: "Imagen publicada, con el hash del commit como tag"
        value: ${{ jobs.publish.outputs.image }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nombre de la imagen
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login a ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build y push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          # El token entra como secret mount: no queda en las capas de la imagen
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha
          cache-to: type=gha,mode=max