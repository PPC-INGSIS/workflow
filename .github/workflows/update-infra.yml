name: Update infra

# Escribe el hash de la imagen recién publicada en versiones.env, en la rama dev del repo infraestructura.
# Un commit nuevo en versiones.env de dev dispara el deploy a dev (ver deploy.yml en infraestructura).

on:
  # Solo corre cuando otro workflow lo llama, nunca solo
  workflow_call:
    inputs:
      image:
        description: "Imagen publicada, con el hash del commit como tag (el output de docker-publish.yml)"
        type: string
        required: true
      tag-var:
        description: "Variable de versiones.env que se actualiza, por ejemplo SNIPPETS_TAG"
        type: string
        required: true
      client-id:
        description: "Client ID de la GitHub App que escribe en infraestructura"
        type: string
        required: true
    secrets:
      app-private-key:
        description: "Clave privada de esa GitHub App"
        required: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # El token de este repo no se usa: toda la escritura la hace la App
    permissions: {}
    steps:
      - name: Token de la App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: infraestructura

      - name: Checkout de infraestructura
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/infraestructura
          ref: dev
          token: ${{ steps.app-token.outputs.token }}

      - name: Actualizar versiones.env
        env:
          IMAGE: ${{ inputs.image }}
          TAG_VAR: ${{ inputs.tag-var }}
          ORIGEN: ${{ github.repository }}
        run: |
          set -euo pipefail

          sha="${IMAGE##*:}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::El tag de la imagen no es un hash de commit: $sha"; exit 1; }
          [[ "$TAG_VAR" =~ ^[A-Z]+_TAG$ ]] || { echo "::error::Nombre de variable inválido: $TAG_VAR"; exit 1; }
          grep -q "^${TAG_VAR}=" versiones.env || { echo "::error::versiones.env no tiene la variable $TAG_VAR"; exit 1; }

          git config user.name "ppc-ingsis-infra-updater[bot]"
          git config user.email "ppc-ingsis-infra-updater[bot]@users.noreply.github.com"

          # Si otro servicio actualizó versiones.env en el medio, el push es rechazado: se parte de
          # cero desde dev y se vuelve a aplicar el cambio, en lugar de resolver conflictos.
          for intento in 1 2 3 4 5; do
            git fetch --quiet origin dev
            git reset --quiet --hard origin/dev

            sed -i "s/^${TAG_VAR}=.*/${TAG_VAR}=${sha}/" versiones.env
            if git diff --quiet; then
              echo "versiones.env ya tiene ${TAG_VAR}=${sha}: no hay nada que hacer"
              exit 0
            fi

            git commit --quiet -m "dev: ${TAG_VAR} -> ${sha:0:7} (${ORIGEN})" versiones.env
            if git push --quiet origin HEAD:dev; then
              echo "versiones.env actualizado: ${TAG_VAR}=${sha}"
              exit 0
            fi

            echo "Push rechazado (intento ${intento}): otro cambio entró antes. Reintentando."
            sleep $((RANDOM % 5 + 1))
          done

          echo "::error::No se pudo actualizar versiones.env después de 5 intentos"
          exit 1
